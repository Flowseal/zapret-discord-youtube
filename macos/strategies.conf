# Стратегии обхода DPI для macOS (движок tpws).
#
# Формат строки:  имя | опции для TLS (443 и др.) | опции для HTTP (80) | описание
#
# Здесь нет fake/seqovl/quic-стратегий из .bat файлов: они требуют инъекции
# пакетов (WinDivert/NFQUEUE), чего в macOS нет. Доступны только те приёмы,
# которые делаются из TCP-потока: split, disorder, oob, tlsrec, host-трюки.
# --mss и --fix-seg в macOS не поддерживаются, --oob вместе с --disorder на
# macOS использовать нельзя (портит поток).
#
# Подобрать рабочую строку:  ./macos/zapret.sh test

split2            | --split-pos=2                                              | --split-pos=method+2                      | split на 2-м байте
split-sni         | --split-pos=sniext+1                                       | --split-pos=method+2                      | split в начале SNI
multisplit        | --split-pos=1,sniext+1,host+1,midsld,endhost-1             | --split-pos=method+2,midsld               | несколько точек split
disorder          | --split-pos=1,midsld --disorder                            | --split-pos=method+2,midsld --disorder    | split + отправка задом наперёд (по умолчанию)
disorder-sni      | --split-pos=sniext+1 --disorder                            | --split-pos=method+2 --disorder           | split в SNI + disorder
oob               | --split-pos=1,midsld --oob                                 | --split-pos=method+2,midsld --oob         | split + out-of-band байт
tlsrec            | --tlsrec=midsld                                            | --hostcase                                | две TLS-записи
tlsrec-split      | --tlsrec=sniext+1 --split-pos=1,midsld                     | --split-pos=method+2,midsld --hostcase    | две TLS-записи + split
tlsrec-disorder   | --tlsrec=sniext+1 --split-pos=1,midsld --disorder          | --split-pos=method+2,midsld --disorder    | две TLS-записи + split + disorder
hostcase          | --split-pos=1                                              | --hostcase --hostdot --split-pos=method+2 | трюки с заголовком Host (для http)
none              |                                                            |                                           | без вмешательства (контрольный прогон)
